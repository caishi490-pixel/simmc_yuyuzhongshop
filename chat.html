<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阿米 · 对话</title>
<style>
:root{--line:#e6e9ec;--ink:#20262c;--dim:#9aa4ad;--blue:#12b7f5;--soft:#fafbfc}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 50% 0%,#eef2f6,#d6dbe1 70%);font-family:"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
.app{display:flex;width:min(1000px,100%);height:min(730px,90vh);background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 22px 60px rgba(25,40,55,.30),0 2px 6px rgba(25,40,55,.10)}

/* 左侧会话列表 */
.side{width:196px;background:#f5f6f8;border-right:1px solid var(--line);display:flex;flex-direction:column}
.me{display:flex;align-items:center;gap:10px;padding:13px 12px;border-bottom:1px solid var(--line)}
.me img{width:34px;height:34px;border-radius:10px;object-fit:cover;background:#e6eaee}
.me img,.row .av,.ava{image-rendering:-webkit-optimize-contrast}
.me .nm{font-size:13px;color:var(--ink)}
.me .st{font-size:11px;color:var(--dim);margin-top:2px}
.list{flex:1;overflow:auto;padding:6px}
.row{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:default}
.row:hover{background:#eaedf1}
.row.on{background:#e1e8f0}
.row .av{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#e6eaee}
.row .ph{width:36px;height:36px;border-radius:10px;flex:0 0 auto;background:#d9dfe5;color:#6c777f;font-size:13px;display:flex;align-items:center;justify-content:center}
.row .t{font-size:13px;color:#2b333b}
.row .p{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px}

/* 聊天区 */
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:var(--soft)}
.bar .left{display:flex;align-items:baseline}
.bar .name{font-size:14px;color:var(--ink)}
.bar .tag{font-size:11px;color:#3eb94e;border:1px solid #cdeed2;background:#f2fbf3;border-radius:4px;padding:1px 6px;margin-left:8px}
.bar .right{display:flex;align-items:center}
#replay{border:1px solid var(--line);background:#fff;color:#6b767f;font-size:12px;border-radius:6px;padding:4px 10px;cursor:pointer;margin-right:12px}
#replay:hover{background:#f2f4f6}
.wd{width:10px;height:10px;border-radius:50%;background:#d8dee4;display:inline-block;margin-left:6px}
.wd.x{background:#f0b7b2}

.msgs{flex:1;overflow-y:auto;padding:16px 20px 6px}
.time{text-align:center;font-size:11px;color:#b6bfc7;margin:8px 0 16px}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
.msg.on{opacity:1;transform:none}
.ava{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#e9edf1}
.me-ava{display:flex;align-items:center;justify-content:center;background:#cfd6dd;color:#5b666f;font-size:14px}
.bub{max-width:min(560px,70%);font-size:14px;line-height:1.7;padding:9px 13px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink);white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(30,45,60,.04)}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:none}
.msg.tp .bub{display:flex;gap:4px;align-items:center;padding:13px 14px}
.msg.tp i{width:6px;height:6px;border-radius:50%;background:#b6bfc7;display:inline-block;animation:tt 1.1s infinite}
.msg.tp i:nth-child(2){animation-delay:.18s}
.msg.tp i:nth-child(3){animation-delay:.36s}
@keyframes tt{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.inbar{border-top:1px solid var(--line);background:var(--soft);padding:8px 14px 10px}
.inbar textarea{width:100%;height:54px;border:0;outline:0;background:transparent;resize:none;font:14px/1.6 "Microsoft YaHei","Noto Sans SC",system-ui;color:var(--ink)}
.inbar .tools{display:flex;align-items:center;justify-content:space-between}
.inbar .hint{font-size:11px;color:#b6bfc7}
#send{border:0;background:var(--blue);color:#fff;font-size:13px;padding:7px 20px;border-radius:6px;cursor:pointer}
#send:hover{background:#0aa6e0}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="me">
      <img src="assets/ami-avatar-132.png" alt="">
      <div><div class="nm">阿米</div><div class="st">在线 · 本地缓存</div></div>
    </div>
    <div class="list">
      <div class="row on"><img class="av" src="assets/ami-avatar-132.png" alt=""><div><div class="t">阿米</div><div class="p" id="lastp">……</div></div></div>
      <div class="row"><img class="av" src="assets/caishi-avatar-132.png" alt=""><div><div class="t">彩石</div><div class="p">在</div></div></div>
      <div class="row"><img class="av" src="assets/weiqiao-avatar-132.png?v=2" alt=""><div><div class="t">唯俏</div><div class="p">全天在线</div></div></div>
    </div>
  </aside>
  <main class="chat">
    <header class="bar">
      <div class="left"><span class="name">阿米</span><span class="tag">在线</span></div>
      <div class="right"><button id="replay" type="button">重播</button><span class="wd"></span><span class="wd"></span><span class="wd x"></span></div>
    </header>
    <div class="msgs" id="msgs"></div>
    <footer class="inbar">
      <textarea id="ta" placeholder="输入消息，回车发送"></textarea>
      <div class="tools"><span class="hint">界面草稿 · 台词为占位</span><button id="send" type="button">发送</button></div>
    </footer>
  </main>
</div>
<script>
var msgs=document.getElementById("msgs"),ta=document.getElementById("ta"),lastp=document.getElementById("lastp");
var timers=[];
function clr(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers.length=0;msgs.innerHTML="";}
function toBottom(){msgs.scrollTop=msgs.scrollHeight;}
function push(el){msgs.appendChild(el);requestAnimationFrame(function(){el.classList.add("on");toBottom();});}
function mkava(who){
  var a;
  if(who==="ami"){a=document.createElement("img");a.className="ava";a.src="assets/ami-avatar-132.png";a.alt="";}
  else{a=document.createElement("img");a.className="ava";a.src="assets/caishi-avatar-132.png";a.alt="";}
  return a;
}
function bubble(who,text){
  var m=document.createElement("div");
  m.className="msg"+(who==="me"?" me":"");
  m.appendChild(mkava(who));
  var b=document.createElement("div");b.className="bub";b.textContent=text;
  m.appendChild(b);push(m);
  lastp.textContent=text;
}
function typing(){
  var m=document.createElement("div");m.className="msg tp";
  m.appendChild(mkava("ami"));
  var b=document.createElement("div");b.className="bub";
  b.innerHTML="<i></i><i></i><i></i>";
  push(m);return m;
}
function addTime(t){
  var d=document.createElement("div");d.className="time";d.textContent=t;msgs.appendChild(d);
}
var SCRIPT=[
  {who:"ami",t:"在的。",w:700},
  {who:"me",t:"你今天在服务器里忙什么",w:1100},
  {who:"ami",t:"摆台位、试音乐，把木桶里的书又数了一遍。",w:1200},
  {who:"ami",t:"怕漏。",w:800},
  {who:"me",t:"你自己呢，还好吗",w:1400},
  {who:"ami",t:"阿米没事。",w:900},
  {who:"ami",t:"被人叫的时候，阿米就在。",w:1100}
];
function play(){
  clr();addTime("20:31");lastp.textContent="……";
  var t=500;
  for(var i=0;i<SCRIPT.length;i++)(function(m){
    t+=m.w;
    timers.push(setTimeout(function(){
      if(m.who==="ami"){
        var tp=typing();
        timers.push(setTimeout(function(){tp.remove();bubble("ami",m.t);},820));
      }else{bubble("me",m.t);}
    },t));
  })(SCRIPT[i]);
}
function sendMsg(){
  var v=ta.value.replace(/\s+$/,"");if(!v)return;
  bubble("me",v);ta.value="";ta.focus();toBottom();
}
document.getElementById("send").addEventListener("click",sendMsg);
ta.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
document.getElementById("replay").addEventListener("click",play);
play();
</script>
</body>
</html>
